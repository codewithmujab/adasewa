services:
  postgres:
    image: postgres:17-alpine
    container_name: adasewa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: adasewa
      POSTGRES_PASSWORD: adasewa_local_password
      POSTGRES_DB: adasewa
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - adasewa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adasewa -d adasewa"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: adasewa-neon-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_CONNECTION_STRING: postgres://adasewa:adasewa_local_password@postgres:5432/adasewa
    ports:
      - "127.0.0.1:4445:4444"

volumes:
  adasewa_pgdata:
